[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gardener"
version = "0.2.0.dev20260808"
description = "Safety-gated CLI that dispatches Claude Code to align repos against your own engineering conventions, or tend a whole fleet of repos unattended overnight via each one's own dev-loop skill — never merges without an explicit per-repo opt-in."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "dmccoystephenson" }]
dependencies = []

[project.scripts]
gardener = "gardener.cli:main"

[tool.setuptools.packages.find]
include = ["gardener*"]

[tool.setuptools.package-data]
gardener = ["prompts/*.tmpl"]
